; Standalone PCM5102 DAC test for a bare ESP32-S3.
; Same I2S pins as the Modular Synth project, so the wiring carries straight over.
; Deliberately no PSRAM / 16MB settings, so it boots on any ESP32-S3 dev board.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
